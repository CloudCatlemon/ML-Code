<title>普隆德拉掛機記</title>
<meta name="description" content="RO 風格的 2D 橫向自動掛機遊戲：自動打怪、升級、轉職、精煉與收集卡片。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
:root{
  --page:#1b2440; --page-2:#2a3760;
  --win:#f5f7fc; --win-2:#e5ebf7; --line:#8aa0cd; --line-2:#c3cfe8;
  --title-a:#7d9ddc; --title-b:#d3e0f8; --title-ink:#14224a;
  --ink:#1b2440; --muted:#5b6887;
  --accent:#e0558a; --accent-2:#b93a6a; --accent-soft:#ffd6e5;
  --hp:#34b04a; --sp:#3a74de; --bexp:#e7b536; --jexp:#a36ad8;
  --good:#17804a; --bad:#c23b3b; --gold:#9a6b00;
  --chat:#0f1628; --chat-ink:#e6ebf7;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100%;background:var(--page);background-image:radial-gradient(circle at 15% -20%,#3a4c84 0,transparent 55%),radial-gradient(circle at 105% 0%,#40306a 0,transparent 45%);color:var(--ink);font:14px/1.5 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
.app{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:14px 32px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;color:#eef2fb}
.brand h1{margin:0;font-weight:900;font-size:clamp(22px,3.4vw,30px);letter-spacing:.05em;line-height:1.15;text-wrap:balance}
.brand h1 span{color:#ff9fc2}
.brand p{margin:2px 0 0;font-size:12px;color:#aebbe0}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid #5d74aa;border-radius:6px;overflow:hidden}
.seg button{font:700 12px "Pixelify Sans","Noto Sans TC",monospace;background:#2c3b66;color:#cfd9f5;border:0;padding:5px 11px;cursor:pointer}
.seg button+button{border-left:1px solid #5d74aa}
.seg button[aria-pressed="true"]{background:#ff9fc2;color:#3a1024}
.save-note{font-size:11px;color:#8fa0cc;font-variant-numeric:tabular-nums}
.stage{position:relative;border:2px solid #0c1226;border-radius:8px;overflow:hidden;background:#0c1226;box-shadow:0 8px 28px rgba(0,0,0,.35)}
#game{display:block;width:100%;height:auto;aspect-ratio:960/440;max-width:100%}
.panels{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:820px){.panels{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.win{background:var(--win);border:1px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:0 2px 0 #0d1429}
.win>h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;padding:4px 10px;background:linear-gradient(180deg,var(--title-a),var(--title-b));color:var(--title-ink);display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.win>h2 small{font-weight:500;letter-spacing:0;color:#34467a}
.px{font-family:"Pixelify Sans","Noto Sans TC",monospace;font-variant-numeric:tabular-nums}
.basic{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.who{display:flex;gap:10px;align-items:center}
.who canvas{width:56px;height:62px;border:1px solid var(--line-2);border-radius:4px;background:linear-gradient(#eef3fc,#d9e3f5);flex:none}
.who .nm{font-weight:700;font-size:15px;line-height:1.2}
.who .cl{font-size:12px;color:var(--muted)}
.brow{display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:center;gap:8px;font-size:12px}
.brow b{font-family:"Pixelify Sans",monospace;font-weight:700;font-size:12px}
.brow .v{font-family:"Pixelify Sans",monospace;font-variant-numeric:tabular-nums;color:var(--muted);min-width:78px;text-align:right}
.bar{height:10px;background:#d3dbeb;border:1px solid #8f9fc2;border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;transition:width .2s linear}
.bar.hp>i{background:linear-gradient(#63d877,var(--hp))}
.bar.sp>i{background:linear-gradient(#78a4f5,var(--sp))}
.bar.be>i{background:linear-gradient(#ffd972,var(--bexp))}
.bar.je>i{background:linear-gradient(#cda0f5,var(--jexp))}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px;font-size:12px;margin-top:4px;padding-top:6px;border-top:1px dashed var(--line-2)}
.kv div{display:flex;justify-content:space-between;gap:6px}
.kv span{color:var(--muted)}
.kv b{font-family:"Pixelify Sans",monospace;font-variant-numeric:tabular-nums;font-weight:700}
.chat{background:var(--chat);color:var(--chat-ink);height:190px;overflow-y:auto;padding:6px 10px;font-size:12px;line-height:1.6}
.chat p{margin:0;word-break:break-all}
.chat .sys{color:#ffe38a}.chat .item{color:#9ff08a}.chat .card{color:#ff9fe0;font-weight:700}.chat .bad{color:#ff8f8f}.chat .lv{color:#8fd8ff;font-weight:700}.chat .mvp{color:#ffb14a;font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:3px;padding:6px 6px 0;background:var(--win-2);border-bottom:1px solid var(--line)}
.tab{font:inherit;font-size:13px;padding:4px 11px;border:1px solid var(--line);border-bottom:none;border-radius:5px 5px 0 0;background:#d9e1f1;color:var(--muted);cursor:pointer;position:relative;top:1px}
.tab[aria-selected="true"]{background:var(--win);color:var(--ink);font-weight:700}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:4px;vertical-align:2px}
.tabbody{padding:12px 14px;max-height:470px;overflow:auto}
.tabbody h3{margin:14px 0 6px;font-size:13px;letter-spacing:.06em;color:#2f4379;border-bottom:1px solid var(--line-2);padding-bottom:3px}
.tabbody h3:first-child{margin-top:0}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.btn{font:inherit;font-size:12px;line-height:1.3;padding:4px 10px;border:1px solid #7f93c0;border-radius:4px;background:linear-gradient(#ffffff,#dbe3f3);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:linear-gradient(#ffffff,#cbd8f0)}
.btn.pri{background:linear-gradient(#f37ca6,#d6457a);border-color:#b23a66;color:#fff}
.btn.pri:hover:not(:disabled){background:linear-gradient(#f68db2,#c93c70)}
.btn.sm{padding:1px 8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid #ffb400;outline-offset:1px}
table{border-collapse:collapse;width:100%}
.tbl td,.tbl th{padding:4px 6px;border-bottom:1px solid #e1e7f3;text-align:left;font-size:13px;vertical-align:middle}
.tbl th{font-weight:700;color:#2f4379}
.tbl .r{text-align:right}
.tbl tr:last-child td,.tbl tr:last-child th{border-bottom:none}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.bonus{color:var(--good);font-size:11px;margin-left:3px}
.pts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:10px;font-size:13px}
.pts b{font-family:"Pixelify Sans",monospace;font-size:18px;color:var(--accent-2)}
label.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px}
.skill{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #e1e7f3}
.skill:last-child{border-bottom:none}
.sico{width:34px;height:34px;border-radius:6px;border:1px solid #7f93c0;display:grid;place-items:center;font-weight:900;color:#fff;font-size:15px;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.skill.locked{opacity:.5}
.skill .nm{font-weight:700;font-size:13px}
.skill .ds{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:9px;background:#e3e9f6;color:#34467a;margin-left:4px;font-weight:500}
.tag.pas{background:#e7f6ea;color:#1d6b3a}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.job{font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;border:1px solid var(--line);border-radius:6px;background:linear-gradient(#fff,#e9eef9);cursor:pointer;color:var(--ink);text-align:center}
.job:hover{border-color:var(--accent);background:linear-gradient(#fff,#ffe9f1)}
.job canvas{width:80px;height:88px}
.job small{font-size:11px;color:var(--muted);line-height:1.35}
.dotc{display:inline-block;width:10px;height:10px;border-radius:3px;border:1px solid rgba(0,0,0,.3);margin-right:6px;vertical-align:-1px;background:var(--c)}
.setrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:8px 0;font-size:13px}
.setrow input[type=range]{flex:1 1 160px;accent-color:var(--accent)}
.eqs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.eq{border:1px solid var(--line-2);border-radius:6px;padding:10px;background:#fbfcff;display:flex;flex-direction:column;gap:6px}
.eq .slot{font-size:11px;letter-spacing:.1em;color:var(--muted)}
.eq .nm{font-weight:900;font-size:16px}
.eq .nm .rf{color:#2f64c8;font-family:"Pixelify Sans",monospace}
.eq .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.mapc{border:1px solid var(--line-2);border-radius:6px;padding:10px;background:#fbfcff;display:flex;flex-direction:column;gap:4px}
.mapc.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.mapc.lock{opacity:.55}
.mapc .code{font-family:"Pixelify Sans",monospace;font-size:11px;color:var(--muted)}
.mapc .nm{font-weight:700}
.mapc .mobs{font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.cardc{border:1px solid #c9b27a;border-radius:6px;padding:6px 8px;background:linear-gradient(#fffaf0,#f3e6c4);font-size:12px;display:flex;flex-direction:column;gap:2px;min-height:78px}
.cardc b{font-size:12px}
.cardc .fx{color:#6b5320}
.cardc .cnt{font-family:"Pixelify Sans",monospace;color:var(--accent-2)}
.cardc.no{background:#eef1f7;border-color:#cfd6e6;color:#98a2ba}
.modal{position:fixed;inset:0;background:rgba(9,13,28,.66);display:grid;place-items:center;padding:16px;z-index:20}
.modal .win{width:100%;max-width:680px;max-height:90vh;overflow:auto}
.modal .mb{padding:14px}
.modal .mb p{margin:0 0 10px}
.inline-in{font:inherit;padding:3px 8px;border:1px solid #9fb0d4;border-radius:4px;width:160px;max-width:100%}
.foot{font-size:11px;color:#8193c2;text-align:center}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>普隆德拉<span>掛機記</span></h1>
      <p>RO 風格橫向自動掛機 · 自動打怪、撿物、升級、轉職、精煉、收集卡片</p>
    </div>
    <div class="ctrl">
      <div class="seg" role="group" aria-label="遊戲速度">
        <button type="button" data-speed="1" aria-pressed="true">x1</button>
        <button type="button" data-speed="2" aria-pressed="false">x2</button>
        <button type="button" data-speed="4" aria-pressed="false">x4</button>
      </div>
      <span class="save-note" id="saveNote">自動存檔</span>
    </div>
  </header>

  <div class="stage"><canvas id="game" aria-label="遊戲畫面：角色自動在地圖上打怪"></canvas></div>

  <div class="panels">
    <div class="col">
      <section class="win" aria-labelledby="bw-h">
        <h2 id="bw-h">基本資訊 <small id="bw-map">—</small></h2>
        <div class="basic">
          <div class="who">
            <canvas id="bw-face" width="112" height="124" aria-hidden="true"></canvas>
            <div><div class="nm" id="bw-name">—</div><div class="cl" id="bw-cls">—</div></div>
          </div>
          <div class="brow"><b>HP</b><div class="bar hp"><i id="bw-hpb"></i></div><span class="v" id="bw-hp">0 / 0</span></div>
          <div class="brow"><b>SP</b><div class="bar sp"><i id="bw-spb"></i></div><span class="v" id="bw-sp">0 / 0</span></div>
          <div class="brow"><b id="bw-bl">Base 1</b><div class="bar be"><i id="bw-beb"></i></div><span class="v" id="bw-be">0%</span></div>
          <div class="brow"><b id="bw-jl">Job 1</b><div class="bar je"><i id="bw-jeb"></i></div><span class="v" id="bw-je">0%</span></div>
          <div class="kv">
            <div><span>Zeny</span><b id="bw-zeny">0</b></div>
            <div><span>擊殺數</span><b id="bw-kills">0</b></div>
            <div><span>Base EXP/時</span><b id="bw-rate">0</b></div>
            <div><span>Zeny/時</span><b id="bw-zrate">0</b></div>
            <div><span>紅/橙/黃/白</span><b id="bw-pots">0</b></div>
            <div><span>藍色藥水</span><b id="bw-blue">0</b></div>
          </div>
        </div>
      </section>
      <section class="win" aria-labelledby="chat-h">
        <h2 id="chat-h">訊息</h2>
        <div class="chat" id="chat" role="log" aria-live="off"></div>
      </section>
    </div>

    <section class="win" aria-label="角色選單">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="tabbody" id="tabbody" role="tabpanel"></div>
    </section>
  </div>
  <p class="foot">同人致敬作品，怪物與地名取材自 RO 仙境傳說。進度存在本機瀏覽器；離開期間依掛機效率的一半結算離線收益（最多 8 小時）。</p>
</div>

<div class="modal" id="modal" hidden>
  <section class="win" role="dialog" aria-modal="true" aria-labelledby="modal-h">
    <h2 id="modal-h">—</h2>
    <div class="mb" id="modal-b"></div>
  </section>
</div>

function skLv(sk){if(S.JL<sk.un)return 0;if(S.cls==='novice')return Math.min(10,S.JL);return Math.min(10,1+Math.floor((S.JL-sk.un)/4))}
function passLv(id){const sk=(SKILLS[S.cls]||[]).find(s=>s.id===id);return sk?skLv(sk):0}

function cardBonus(){const b={};for(const k in S.cards){const m=MOBS[k];if(!m||!S.cards[k])continue;const n=Math.min(3,S.cards[k]);for(const f in m.card)b[f]=(b[f]||0)+m.card[f]*n}return b}
function recalc(){
 const c=CL(),cb=cardBonus(),L=S.L,st={};
 for(const k of STATS)st[k]=S.st[k]+(cb[k]||0);
 const owl=passLv('owl'),bl=passLv('bless');st.dex+=owl+bl;st.str+=bl;st.int+=bl;
 Object.assign(P,st);P.cb=cb;
 P.maxHp=Math.floor((35+L*9+L*L*.25)*c.hp*(1+st.vit*.01))+st.vit*3+(cb.hp||0);
 P.maxSp=Math.floor((10+L*2.2)*c.sp*(1+st.int*.01))+st.int*2+(cb.sp||0);
 const main=c.dexAtk?st.dex:st.str,sub=c.dexAtk?st.str:st.dex;
 P.watk=WATK[S.wpn.t]+S.wpn.r*(3+S.wpn.t*2);
 P.atk=main+Math.pow(Math.floor(main/10),2)+Math.floor(sub/5)+Math.floor(st.luk/5)+P.watk+(cb.atk||0);
 const mb=st.int+Math.pow(Math.floor(st.int/7),2);
 P.matk=Math.floor((mb+(c.caster?P.watk*.7:0))*(c.caster?1.15:1))+(cb.matk||0);
 P.def=ADEF[S.arm.t]+S.arm.r*2+(cb.def||0);P.defPct=P.def/(P.def+60);P.softDef=Math.floor(st.vit/2);
 P.hit=L+st.dex+(cb.hit||0);P.flee=L+st.agi+(cb.flee||0);
 P.crit=Math.min(60,1+st.luk*.3+(cb.crit||0));
 P.aspdInt=Math.max(.28,(1.4-st.agi*.011-st.dex*.0025)*c.aspd);P.aspd=Math.min(190,Math.floor(200-P.aspdInt*50));
 P.speed=150+Math.min(60,st.agi*.6);
 hero.hp=Math.min(hero.hp,P.maxHp);hero.sp=Math.min(hero.sp,P.maxSp);
 hero.ranged=!!c.ranged;
}
function autoStat(){
 if(!S.set.autoStat)return;const b=CL().build;let guard=0;
 while(guard++<500){let best=null,bs=1e9;for(const k in b){if(!b[k]||S.st[k]>=99)continue;const s=S.st[k]/b[k];if(s<bs){bs=s;best=k}}
  if(!best||S.pts<statCost(S.st[best]))break;S.pts-=statCost(S.st[best]);S.st[best]++}
 recalc();
}

/* ================= 地圖 / 導航 ================= */
function buildMap(){
 const lay=LAYOUTS[MAP().lay];
 SURF=[{i:0,x1:0,x2:MAPW,y:GROUND}].concat(lay.map((p,i)=>({i:i+1,x1:p[0],x2:p[1],y:p[2]})));
 EDGES=SURF.map(A=>{const out=[];for(const B of SURF){if(A===B)continue;const lo=Math.max(A.x1,B.x1)+24,hi=Math.min(A.x2,B.x2)-24;if(lo>=hi)continue;
  if(B.y<A.y&&A.y-B.y<=110)out.push({b:B.i,type:'jump',lo,hi});else if(B.y>A.y&&A.i!==0)out.push({b:B.i,type:'drop',lo,hi})}return out});
}
function navNext(from,to){
 if(from===to)return null;const prev=new Array(SURF.length).fill(-1);prev[from]=from;const q=[from];
 while(q.length){const a=q.shift();if(a===to)break;for(const e of EDGES[a])if(prev[e.b]<0){prev[e.b]=a;q.push(e.b)}}
 if(prev[to]<0)return null;let c=to;while(prev[c]!==from)c=prev[c];return EDGES[from].find(e=>e.b===c);
}
function setMap(i,quiet){
 S.map=i;buildMap();mobs=[];projs=[];loots=[];timers=[];fxs=[];
 hero.x=120;hero.y=GROUND;hero.vy=0;hero.grounded=true;hero.surf=0;hero.target=null;hero.sit=false;cam=0;
 const m=MAP();for(let k=0;k<10;k++)spawnMob();
 mvpT=180;if(!quiet)log(`移動到 ${m.n}（${m.code}）`,'sys');
 dirty=true;
}

function mobStats(d){
 const L=d.lv;let hp=Math.floor((40+18*L+.12*L*L)*(d.hpm||1)),atk=Math.floor((6+L*2.3)*(d.atkm||1)),exp=Math.floor(3+Math.pow(L,1.6)*1.5);
 if(d.mvp){hp*=28;atk=Math.floor(atk*1.7);exp*=25}
 return{hp,atk,exp,jexp:Math.floor(exp*.75),def:Math.floor(L*.55*(d.mvp?1.5:1)),mdef:Math.floor(L*.3),hit:Math.floor(L*1.5+15),flee:Math.floor(L*1.2+8)};
}
function pickSurf(){let tot=0;for(const s of SURF)tot+=s.x2-s.x1;let r=Math.random()*tot;for(const s of SURF){r-=s.x2-s.x1;if(r<=0)return s}return SURF[0]}
function spawnMob(key){
 const map=MAP();key=key||map.mobs[Math.floor(Math.random()*map.mobs.length)];
 const d=MOBS[key],dim=DIM[d.sh==='bird'&&d.v==='big'?'birdbig':d.sh],sz=(d.size||1)*(d.mvp?1.7:1),st=mobStats(d);
 let s,x,tries=0;do{s=pickSurf();x=rand(s.x1+30,s.x2-30);tries++}while(tries<6&&Math.abs(x-hero.x)<160&&Math.abs(s.y-hero.y)<60);
 const m={id:++mobId,key,d,lv:d.lv,maxHp:st.hp,hp:st.hp,atk:st.atk,def:st.def,mdef:st.mdef,hit:st.hit,flee:st.flee,exp:st.exp,jexp:st.jexp,
  spd:d.spd||55,x,y:s.y,surf:s.i,face:Math.random()<.5?-1:1,w:dim[0]*sz,h:dim[1]*sz,sz,fly:!!dim[2],aggro:false,atkCd:1,hurt:0,dead:false,deathT:0,
  wT:rand(0,2),wDir:0,walk:rand(0,6),phase:rand(0,6),poison:null,boss:!!d.mvp,atkAnim:9,moving:false,stolen:false};
 mobs.push(m);return m;
}
const mobCY=m=>m.y-m.h/2-(m.fly?28:0);
function mobUpdate(m,dt){
 if(m.dead){m.deathT+=dt;return}
 m.hurt=Math.max(0,m.hurt-dt);m.atkCd-=dt;m.atkAnim+=dt;
 if(m.poison){m.poison.t-=dt;m.poison.tick-=dt;if(m.poison.tick<=0){m.poison.tick=1;const pd=Math.max(1,Math.floor(m.poison.dps));m.hp-=pd;floatText(m.x,mobCY(m)-10,pd,'#c77dff',{size:15});if(m.hp<=0){killMob(m);return}}if(m.poison&&m.poison.t<=0)m.poison=null}
 const s=SURF[m.surf],d=m.d,dx=hero.x-m.x,dy=hero.y-m.y;
 const can=!hero.dead&&hero.inv<=0;
 if(!m.aggro&&d.aggr&&can&&Math.abs(dx)<(m.boss?320:230)&&Math.abs(dy)<70)m.aggro=true;
 if(!can)m.aggro=false;
 let mv=0;
 if(m.aggro){
  if(d.range){const dist=Math.hypot(dx,hero.y-28-mobCY(m));if(dist>d.range)mv=Math.sign(dx);else{m.face=dx>=0?1:-1;if(m.atkCd<=0)mobAttack(m,true)}}
  else if(hero.grounded&&hero.surf===m.surf||Math.abs(dy)<20){if(Math.abs(dx)>m.w/2+10)mv=Math.sign(dx);else{m.face=dx>=0?1:-1;if(m.atkCd<=0)mobAttack(m,false)}}
  else mv=Math.abs(dx)>40?Math.sign(dx)*.5:0;
 }else{m.wT-=dt;if(m.wT<=0){m.wT=rand(1.5,4);m.wDir=Math.random()<.4?0:(Math.random()<.5?-1:1)}mv=m.wDir*.5}
 m.moving=!!mv;
 if(mv){m.face=mv>0?1:-1;m.x+=mv*m.spd*dt;m.walk+=dt*8}
 const lo=s.x1+m.w/2,hi=s.x2-m.w/2;if(m.x<lo){m.x=lo;m.wDir=1}if(m.x>hi){m.x=hi;m.wDir=-1}
}
function mobAttack(m,ranged){
 m.atkCd=m.boss?1.25:(m.d.aspd||1.6);m.atkAnim=0;
 if(ranged)projs.push({x:m.x+m.face*10,y:mobCY(m)-6,t:'hero',kind:'marrow',spd:620,onHit:()=>mobHitsHero(m)});
 else mobHitsHero(m);
}
function mobHitsHero(m){
 if(hero.dead||hero.inv>0)return;hero.sit=false;
 const hc=clamp(80+m.hit-P.flee,5,95);
 if(Math.random()*100>=hc){floatText(hero.x,hero.y-62,'Miss','#dfe6ff',{size:15});return}
 const dmg=Math.max(1,Math.floor(m.atk*rand(.85,1.15)*(1-P.defPct)-P.softDef));
 hero.hp-=dmg;floatText(hero.x,hero.y-62,dmg,'#ff5252',{size:17});burst(hero.x,hero.y-30,'#ffb0b0',5);
 if(hero.hp<=0)heroDie();
}
function killMob(m){
 if(m.dead)return;m.dead=true;m.deathT=0;m.poison=null;S.kills++;
 gainExp(m.exp,m.jexp);
 const lk=1+P.luk*.004;
 const z=Math.floor((m.lv*2+ri(0,m.lv*2)+3)*(m.boss?20:1));
 dropLoot(m,'zeny','zeny',z+' Zeny','#f2c23a',z);
 for(const [nm,p,ch] of m.d.dr){if(Math.random()*100<ch*lk){
  if(nm==='@box')dropLoot(m,'box','box','古老的藍箱','#3f6fd0',ri(m.lv*120,m.lv*300));
  else if(nm[0]==='@'){const k=nm.slice(1);if(ORES[k])dropLoot(m,'ore',k,ORES[k].n,ORES[k].c);else{const pt=POTS.find(x=>x.id===k);dropLoot(m,'pot',k,pt.n,pt.c)}}
  else dropLoot(m,'etc',nm,nm,ETC[nm].c)}}
 if(m.lv>=8){if(Math.random()<.012*lk)dropLoot(m,'ore','ori','神之金屬',ORES.ori.c);if(Math.random()<.012*lk)dropLoot(m,'ore','elu','鋁',ORES.elu.c)}
 if(Math.random()*100<(m.boss?8:.5)*(1+P.luk*.01))dropLoot(m,'card',m.key,m.d.n+'卡片','#f5d77a');
 if(m.boss){S.mvps++;mvpT=300;showBanner('MVP!!',`${S.name} 擊敗了 ${m.d.n}`,'#ffb14a');log(`★ MVP！擊敗 ${m.d.n}，獲得 Base EXP ${fmt(m.exp)}、Job EXP ${fmt(m.jexp)}`,'mvp')}
 else timers.push({t:rand(2,4),fn:()=>{if(mobs.filter(x=>!x.dead&&!x.boss).length<10)spawnMob()}});
 if(hero.target===m)hero.target=null;
}

/* ================= 角色 ================= */
function gainExp(e,j){
 acc.e+=e;acc.j+=j;
 if(S.L<99){S.exp+=e;while(S.L<99&&S.exp>=needBase(S.L)){S.exp-=needBase(S.L);S.L++;S.pts+=Math.floor((S.L-1)/5)+3;
  recalc();autoStat();hero.hp=P.maxHp;hero.sp=P.maxSp;lvFx('Base Level Up!');log(`Base Lv 上升到 ${S.L}！`,'lv')}if(S.L>=99)S.exp=0}
 const mj=maxJob();
 if(S.JL<mj){S.jexp+=j;while(S.JL<mj&&S.jexp>=needJob(S.JL)){S.jexp-=needJob(S.JL);S.JL++;lvFx('Job Level Up!');log(`Job Lv 上升到 ${S.JL}！`,'lv');recalc()}if(S.JL>=mj)S.jexp=0}
 if(S.cls==='novice'&&S.JL>=10&&!jobPrompted){jobPrompted=true;timers.push({t:1.2,fn:openJobModal})}
 dirty=true;
}
function addZeny(z){S.zeny=Math.max(0,S.zeny+z);if(z>0)acc.z+=z}
function heroDie(){
 hero.dead=true;hero.deadT=4;hero.hp=0;hero.sit=false;hero.target=null;S.deaths++;deathLog.push(gt);
 if(S.cls!=='novice'&&S.L<99){const loss=Math.floor(needBase(S.L)*.01);S.exp=Math.max(0,S.exp-loss);log(`你已經死亡……損失 ${fmt(loss)} Base EXP`,'bad')}
 else log('你已經死亡……（初心者死亡不會損失經驗值）','bad');
 for(const m of mobs)m.aggro=false;
 deathLog=deathLog.filter(t=>gt-t<150);
 if(deathLog.length>=3&&S.set.autoMap&&S.map>0){holdT=300;deathLog=[];log('連續陣亡，暫時退回較低等級的地圖','sys')}
}
function respawn(){hero.dead=false;hero.hp=P.maxHp;hero.sp=P.maxSp;hero.x=120;hero.y=GROUND;hero.surf=0;hero.grounded=true;hero.vy=0;hero.inv=2.5;log('在儲存點復活了','sys')}
function usePots(){
 if(hero.potCd>0||hero.dead)return;
 if(hero.hp<P.maxHp*S.set.potHp/100){const miss=P.maxHp-hero.hp,mul=1+P.vit*.02;
  const own=POTS.filter(p=>p.hp&&S.inv[p.id]>0);if(own.length){let pk=own.filter(p=>p.hp*mul<=miss).pop()||own[0];S.inv[pk.id]--;const a=Math.floor(pk.hp*mul*rand(.9,1.1));healHero(a);hero.potCd=.6;burst(hero.x,hero.y-40,pk.c,8);dirty=true;return}}
 if(hero.sp<P.maxSp*S.set.potSp/100&&S.inv.blue>0){S.inv.blue--;const a=Math.floor(60*(1+P.int*.01));hero.sp=Math.min(P.maxSp,hero.sp+a);floatText(hero.x,hero.y-70,a,'#7fb0ff',{size:15});hero.potCd=.6;burst(hero.x,hero.y-40,'#3f6fe0',8);dirty=true}
}
function healHero(a){hero.hp=Math.min(P.maxHp,hero.hp+a);floatText(hero.x,hero.y-70,a,'#6cf08a',{size:17});for(let i=0;i<10;i++)parts.push({x:hero.x+rand(-14,14),y:hero.y-rand(0,50),vx:0,vy:-rand(30,80),life:rand(.5,.9),max:.9,c:i%2?'#d8ffe0':'#6cf08a',sz:rand(2,3.5),g:0,star:1})}
function findTarget(){
 let best=null,bs=1e9;
 for(const m of mobs){if(m.dead)continue;if(m.boss&&(!S.set.mvp||S.L<m.lv-3)&&!m.aggro)continue;
  let s=Math.abs(m.x-hero.x)+Math.abs(m.y-hero.y)*2.2;if(m.surf!==hero.surf)s+=160;if(m.aggro)s-=220;if(m.boss)s-=100;
  if(!hero.ranged&&m.surf!==hero.surf&&!navNext(hero.surf,m.surf))continue;
  if(s<bs){bs=s;best=m}}
 return best;
}
function canHit(t,r){
 if(r<=90)return hero.grounded&&t.surf===hero.surf&&Math.abs(t.x-hero.x)<=r+t.w/2;
 return Math.hypot(t.x-hero.x,mobCY(t)-(hero.y-28))<=r;
}
function spOK(sk,l){return hero.sp>=sk.sp(l)&&(!sk.zeny||S.zeny>=sk.zeny(l))}
function approachRange(){
 let r=CL().range;
 for(const sk of SKILLS[S.cls]){if(sk.passive||!sk.range)continue;const l=skLv(sk);if(!l||S.skillOff[sk.id]||(hero.cds[sk.id]||0)>0||!spOK(sk,l))continue;r=Math.max(r,sk.range)}
 return r;
}
function shoot(kind,t,onHit){projs.push({x:hero.x+hero.face*16,y:hero.y-32,t,kind,spd:kind==='arrow'?900:640,onHit})}
function shout(n){floats.push({x:hero.x,y:hero.y-84,text:n+'!!',col:'#fff',vy:-18,g:0,life:1.1,max:1.1,size:13,kind:'shout'})}
function trySkill(t){
 for(const sk of SKILLS[S.cls]){
  if(sk.passive)continue;const l=skLv(sk);if(!l||S.skillOff[sk.id]||(hero.cds[sk.id]||0)>0||!spOK(sk,l))continue;
  const rng=sk.range||CL().range;let ok=false;
  switch(sk.kind){
   case'heal':if(hero.hp<P.maxHp*.6){healHero(sk.amt(l));ok=true}break;
   case'single':if(t&&canHit(t,rng)){const r=calcPhys(t,sk.mult(l),sk.hitB?sk.hitB(l):0,sk.flat?sk.flat(l):0);applyHit(t,r,{big:1});slash(t,sk.c);
     if(sk.poison&&!r.miss&&!t.dead)t.poison={t:4,tick:1,dps:sk.poison(l)+P.atk*.08};
     if(sk.zeny)for(let i=0;i<8;i++)parts.push({x:hero.x,y:hero.y-40,vx:rand(-120,120),vy:-rand(150,300),life:.8,max:.8,c:'#f2c23a',sz:3,g:900});ok=true}break;
   case'bolt':if(t&&canHit(t,rng)){const n=sk.bolts(l);for(let i=0;i<n;i++)timers.push({t:i*.12,fn:()=>{if(!t.dead)shoot(sk.pk,t,()=>applyHit(t,calcMag(t,sk.mult(l))))}});ok=true}break;
   case'arrows':if(t&&canHit(t,rng)){for(let i=0;i<2;i++)timers.push({t:i*.1,fn:()=>{if(!t.dead)shoot('arrow',t,()=>applyHit(t,calcPhys(t,sk.mult(l))))}});ok=true}break;
   case'aoeSelf':{const tg=mobs.filter(m=>!m.dead&&Math.abs(m.x-hero.x)<sk.r&&Math.abs(m.y-hero.y)<70);
     if(tg.length&&t&&canHit(t,Math.max(rng,90))){for(const m of tg){applyHit(m,calcPhys(m,sk.mult(l),20));if(!m.dead){m.x+=Math.sign(m.x-hero.x||1)*28}}
      fxs.push({k:'ring',x:hero.x,y:hero.y-20,r:sk.r,c:'#ff8a2a',t:0,dur:.45});for(let i=0;i<24;i++){const a=Math.random()*Math.PI*2;parts.push({x:hero.x,y:hero.y-18,vx:Math.cos(a)*rand(120,300),vy:Math.sin(a)*rand(60,200)-60,life:.6,max:.6,c:i%2?'#ffd24a':'#ff6a2a',sz:rand(2.5,5),g:200})}ok=true}}break;
   case'aoeTarget':if(t&&canHit(t,rng)){const cx=t.x,cy=t.y,n=sk.hits(l);
     for(let i=0;i<n;i++)timers.push({t:i*.18,fn:()=>{fxs.push({k:sk.fx,x:cx+rand(-30,30),y:cy,r:sk.r,t:0,dur:sk.fx==='thunder'?.28:.5});
      for(const m of mobs)if(!m.dead&&Math.abs(m.x-cx)<sk.r&&Math.abs(m.y-cy)<90)applyHit(m,sk.type==='matk'?calcMag(m,sk.mult(l)):calcPhys(m,sk.mult(l)))}});ok=true}break;
   case'steal':if(t&&!t.stolen&&!t.boss&&canHit(t,rng)){t.stolen=true;
     if(Math.random()*100<sk.chance(l)+(P.dex-t.lv)*.5){const pool=t.d.dr.filter(d=>d[0]!=='@box');const it=pool[Math.floor(Math.random()*pool.length)];const nm=it[0];
      if(nm[0]==='@'){const k=nm.slice(1);if(ORES[k])dropLoot(t,'ore',k,ORES[k].n,ORES[k].c);else{const pt=POTS.find(x=>x.id===k);dropLoot(t,'pot',k,pt.n,pt.c)}}else dropLoot(t,'etc',nm,nm,ETC[nm].c);
      floatText(t.x,mobCY(t)-24,'偷竊成功','#9ff08a',{size:14})}else floatText(t.x,mobCY(t)-24,'偷竊失敗','#dfe6ff',{size:14});ok=true}break;
  }
  if(ok){hero.sp-=sk.sp(l);if(sk.zeny)addZeny(-sk.zeny(l));hero.cds[sk.id]=sk.cd||0;hero.atkCd=Math.max(P.aspdInt,.45);hero.anim=0;hero.animDur=.3;shout(sk.n);return true}
 }
 return false;
}
function normalAttack(t){
 hero.atkCd=P.aspdInt;hero.anim=0;hero.animDur=Math.min(.3,P.aspdInt*.8);
 if(hero.ranged){shoot(CL().wk==='bow'?'arrow':'magic',t,()=>applyHit(t,calcPhys(t,1)));return}
 applyHit(t,calcPhys(t,1));slash(t,'#ffffff');
 const dl=passLv('dbl');if(dl&&Math.random()<dl*.05)timers.push({t:.12,fn:()=>{if(!t.dead){applyHit(t,calcPhys(t,1));slash(t,'#ffd0d0')}}});
}
function calcPhys(m,mult=1,hitB=0,flat=0){
 const crit=Math.random()*100<P.crit;
 if(!crit){const hc=clamp(80+P.hit+hitB-m.flee,5,100);if(Math.random()*100>=hc)return{miss:true}}
 let d=P.atk*rand(.92,1.08)*mult+flat;if(crit)d*=1.4;else d-=m.def;
 return{dmg:Math.max(1,Math.floor(d)),crit};
}
function calcMag(m,mult=1){return{dmg:Math.max(1,Math.floor(P.matk*rand(.9,1.1)*mult-m.mdef))}}
function applyHit(m,r,o){
 if(m.dead)return;const y=mobCY(m)-m.h/2-6;
 if(r.miss){floatText(m.x,y,'Miss','#dfe6ff',{size:15});m.aggro=true;return}
 m.hp-=r.dmg;m.hurt=.18;m.aggro=true;
 floatText(m.x+rand(-6,6),y,r.dmg,r.crit?'#ffe14a':'#ffffff',{size:r.crit?24:(o&&o.big?21:18),crit:r.crit});
 burst(m.x,mobCY(m),r.crit?'#ffe14a':'#ffffff',r.crit?8:4);
 if(m.hp<=0)killMob(m);
}
function heroUpdate(dt){
 const h=hero;
 for(const k in h.cds)h.cds[k]=Math.max(0,h.cds[k]-dt);
 h.atkCd-=dt;h.anim+=dt;h.potCd-=dt;h.inv=Math.max(0,h.inv-dt);h.lvfx=Math.max(0,h.lvfx-dt);
 if(h.dead){h.deadT-=dt;if(h.deadT<=0)respawn();return}
 const sitM=h.sit?4:1;
 h.hp=Math.min(P.maxHp,h.hp+(P.maxHp*.004+P.vit*.05)*sitM*dt+P.maxHp*passLv('hpr')*.0015*dt);
 h.sp=Math.min(P.maxSp,h.sp+(P.maxSp*.01+P.int*.05)*sitM*dt+P.maxSp*passLv('spr')*.002*dt);
 usePots();
 const aggroed=mobs.some(m=>m.aggro&&!m.dead);
 if(h.sit){if(aggroed||(h.hp>=P.maxHp*.95&&h.sp>=P.maxSp*.6))h.sit=false;else{phys(0,dt);return}}
 const noHpPot=!POTS.some(p=>p.hp&&S.inv[p.id]>0);
 if(!aggroed&&h.grounded&&((h.hp<P.maxHp*.35&&noHpPot)||(CL().caster&&h.sp<P.maxSp*.12&&!S.inv.blue))){h.sit=true;h.target=null;phys(0,dt);return}
 retargetT-=dt;
 let t=h.target;
 if(!t||t.dead||(retargetT<=0&&t.hp>=t.maxHp&&!t.aggro)){t=h.target=findTarget();retargetT=1.5}
 let dir=0;
 if(h.atkCd<=0&&h.grounded){if(!trySkill(t)&&t&&canHit(t,CL().range)){h.face=t.x>=h.x?1:-1;normalAttack(t)}}
 if(t&&!t.dead){
  const rng=approachRange();
  if(canHit(t,rng)){h.face=t.x>=h.x?1:-1}
  else if(h.grounded){
   const dy=Math.abs(t.y-h.y);
   if(t.surf===h.surf||(rng>90&&dy<rng*.6))dir=Math.sign(t.x-h.x)||1;
   else{const e=navNext(h.surf,t.surf);if(e){const goal=clamp(h.x,e.lo,e.hi);if(Math.abs(goal-h.x)>4)dir=Math.sign(goal-h.x);
     else if(e.type==='jump'){h.vy=JUMPV;h.grounded=false}else{h.dropIgn=h.surf;h.grounded=false;h.vy=40}}else h.target=null}
  }
 }
 phys(dir,dt);
}
function phys(dir,dt){
 const h=hero;
 if(h.grounded){h.vx=dir*P.speed;h.moving=!!dir;if(dir)h.face=dir;if(dir)h.walkPh+=dt*11}else h.vx=0;
 h.x=clamp(h.x+h.vx*dt,16,MAPW-16);
 if(h.grounded){const s=SURF[h.surf];if(h.x<s.x1-2||h.x>s.x2+2){h.grounded=false;h.vy=0;h.dropIgn=-1}}
 if(!h.grounded){const py=h.y;h.vy+=GRAV*dt;h.y+=h.vy*dt;
  if(h.vy>0){let best=null;for(const s of SURF){if(s.i===h.dropIgn||h.x<s.x1||h.x>s.x2)continue;if(py<=s.y+.5&&h.y>=s.y&&(!best||s.y<best.y))best=s}
   if(best){h.y=best.y;h.vy=0;h.grounded=true;h.surf=best.i;h.dropIgn=-1}}
  if(h.y>=GROUND){h.y=GROUND;h.vy=0;h.grounded=true;h.surf=0;h.dropIgn=-1}}
}

/* ================= 掉落物 / 特效 ================= */
function dropLoot(m,kind,key,label,color,amount){loots.push({x:m.x+rand(-10,10),y:mobCY(m),vx:rand(-70,70),vy:-rand(220,340),floor:m.y,kind,key,label,color,amount,t:0,fly:false})}
function collect(l){
 const mult=sellMult();
 switch(l.kind){
  case'zeny':addZeny(l.amount);break;
  case'box':addZeny(l.amount);log(`打開古老的藍箱，獲得 ${fmt(l.amount)} Zeny`,'item');break;
  case'etc':if(S.set.autoSell){const z=Math.floor(ETC[l.key].p*mult);addZeny(z);log(`獲得 ${l.label}（自動賣出 +${z}z）`,'item')}else{S.etc[l.key]=(S.etc[l.key]||0)+1;log(`獲得 ${l.label} × 1`,'item')}break;
  case'pot':S.inv[l.key]=(S.inv[l.key]||0)+1;log(`獲得 ${l.label} × 1`,'item');break;
  case'ore':S.inv[l.key]=(S.inv[l.key]||0)+1;log(`獲得 ${l.label} × 1`,'item');break;
  case'card':S.cards[l.key]=(S.cards[l.key]||0)+1;recalc();log(`★ 獲得 ${l.label}！${fxText(MOBS[l.key].card)}（最多疊加 3 張）`,'card');showBanner('獲得卡片！',l.label,'#ff9fe0');break;
 }
 dirty=true;
}

function slash(t,c){fxs.push({k:'slash',x:t.x,y:mobCY(t),c,f:hero.face,t:0,dur:.18})}

/* ================= 主更新 ================= */
function update(dt){
 gt+=dt;S.played+=dt;
 for(let i=timers.length-1;i>=0;i--){const tm=timers[i];tm.t-=dt;if(tm.t<=0){timers.splice(i,1);tm.fn()}}
 heroUpdate(dt);
 for(const m of mobs)mobUpdate(m,dt);
 mobs=mobs.filter(m=>!(m.dead&&m.deathT>.6));
 for(const p of projs){
  let tx,ty;if(p.t==='hero'){tx=hero.x;ty=hero.y-30}else{if(p.t.dead){p.dead=true;continue}tx=p.t.x;ty=mobCY(p.t)}
  const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);p.a=Math.atan2(dy,dx);
  if(d<14){p.dead=true;p.onHit();continue}
  const st=Math.min(d,p.spd*dt);p.x+=dx/d*st;p.y+=dy/d*st;
  if(p.kind==='fire'||p.kind==='holy')parts.push({x:p.x,y:p.y,vx:rand(-20,20),vy:rand(-20,20),life:.25,max:.25,c:p.kind==='fire'?'#ffb14a':'#fff3a8',sz:3,g:0});
 }
 projs=projs.filter(p=>!p.dead);
 for(const l of loots){l.t+=dt;
  if(!l.fly){if(l.y<l.floor||l.vy<0){l.vy+=GRAV*dt;l.x+=l.vx*dt;l.y+=l.vy*dt;if(l.y>=l.floor){l.y=l.floor;l.vy=0;l.vx=0}}if(l.t>.9&&!hero.dead)l.fly=true}
  else{const dx=hero.x-l.x,dy=hero.y-30-l.y,d=Math.hypot(dx,dy);if(d<16){l.done=true;collect(l)}else{const s=Math.min(d,(500+l.t*300)*dt);l.x+=dx/d*s;l.y+=dy/d*s}}}
 loots=loots.filter(l=>!l.done);
 for(const f of fxs)f.t+=dt;fxs=fxs.filter(f=>f.t<f.dur);
 for(const p of parts){p.life-=dt;p.vy+=(p.g||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}parts=parts.filter(p=>p.life>0);
 for(const f of floats){f.life-=dt;f.vy+=f.g*dt;f.y+=f.vy*dt}floats=floats.filter(f=>f.life>0);
 if(banner){banner.life-=dt;if(banner.life<=0)banner=null}
 // MVP
 if(!mobs.some(m=>m.boss&&!m.dead)){mvpT-=dt;if(mvpT<=0){const m=spawnMob(MAP().mvp);mvpT=300;showBanner('MVP 出現了！',m.d.n+' 降臨 '+MAP().n,'#ff6a6a');log(`【廣播】${m.d.n} 出現在 ${MAP().n}！`,'mvp')}}
 // 自動換圖
 holdT=Math.max(0,holdT-dt);autoMapT-=dt;
 if(autoMapT<=0){autoMapT=5;if(S.set.autoMap&&!hero.dead){let b=0;MAPS.forEach((m,i)=>{if(S.L>=m.req)b=i});if(holdT>0)b=Math.max(0,b-1);if(b!==S.map)setMap(b)}}
 // 效率統計
 acc.t+=dt;if(acc.t>=1){const a=Math.max(1/300,1/(S.played+1));for(const k of['e','j','z'])S.rate[k]=S.rate[k]*(1-a)+(acc[k]/acc.t)*a;acc={e:0,j:0,z:0,t:0}}
 // 攝影機
 const target=clamp(hero.x-W*.45,0,MAPW-W);cam+=(target-cam)*Math.min(1,dt*5);
}

function drawLoot(g,l){

 else{g.fillStyle=l.color;g.beginPath();g.moveTo(0,-12);g.lineTo(6,-5);g.lineTo(0,1);g.lineTo(-6,-5);g.closePath();g.fill();g.fillStyle='rgba(255,255,255,.5)';tri(g,0,-12,3,-6,-3,-6)}

function drawProj(g,p){
 const x=p.x-cam;g.save();g.translate(x,p.y);g.rotate(p.a||0);
 if(p.kind==='arrow'||p.kind==='marrow'){g.strokeStyle=p.kind==='marrow'?'#cfc7b5':'#7a5230';g.lineWidth=2;g.beginPath();g.moveTo(-14,0);g.lineTo(6,0);g.stroke();g.fillStyle='#d8dee8';tri(g,6,-3,12,0,6,3);g.fillStyle='#f0f0f0';tri(g,-14,0,-18,-3,-11,0);tri(g,-14,0,-18,3,-11,0)}
 else{const c=p.kind==='fire'?['#fff2b0','#ff7a2a']:p.kind==='holy'?['#ffffff','#ffd84a']:['#f0d8ff','#9a5aff'];
  const gr=g.createRadialGradient(0,0,1,0,0,12);gr.addColorStop(0,c[0]);gr.addColorStop(.4,c[1]);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;circ(g,0,0,12);if(p.kind==='fire'){g.fillStyle='rgba(255,122,42,.5)';ell(g,-10,0,10,4)}}

function drawFx(g,f){
 const p=f.t/f.dur,x=f.x-cam;
 switch(f.k){
  case'slash':g.save();g.translate(x,f.y);g.scale(f.f,1);g.strokeStyle=f.c;g.globalAlpha=1-p;g.lineWidth=4*(1-p)+1;g.beginPath();g.arc(-6,0,18+p*6,-1.2,.9);g.stroke();g.restore();break;
  case'ring':g.strokeStyle=f.c;g.globalAlpha=1-p;g.lineWidth=6*(1-p)+1;g.beginPath();g.ellipse(x,f.y+14,f.r*p,f.r*p*.35,0,0,7);g.stroke();g.globalAlpha=1;break;
  case'thunder':{g.globalAlpha=1-p;g.strokeStyle='#fff9c0';g.shadowColor='#ffe14a';g.shadowBlur=14;g.lineWidth=3;g.beginPath();let yy=0,xx=x;g.moveTo(xx,0);while(yy<f.y){yy+=24;xx+=rand(-14,14);g.lineTo(xx,yy)}g.stroke();g.shadowBlur=0;g.fillStyle='rgba(255,240,150,.35)';ell(g,x,f.y,50,10);g.globalAlpha=1;break}
  case'arrows':g.strokeStyle='#5a3a1a';g.lineWidth=2;for(let i=0;i<9;i++){const ax=x+(hash(i+f.x)-.5)*f.r*1.6,ay=-40+p*(f.y+40)-hash(i*3)*60;if(ay>f.y)continue;g.beginPath();g.moveTo(ax-4,ay-18);g.lineTo(ax,ay);g.stroke()}break;
  case'cart':g.strokeStyle='#c98a3a';g.globalAlpha=1-p;g.lineWidth=5;g.beginPath();g.ellipse(x,f.y-4,f.r*p,f.r*p*.3,0,0,7);g.stroke();g.globalAlpha=1;break;
 }
}

   const val=isW?`ATK ${WATK[e.t]} + 精煉 ${e.r*(3+e.t*2)}`:`DEF ${ADEF[e.t]} + 精煉 ${e.r*2}`;const nt=e.t+1,canUp=nt<7;
   return`<div class="eq"><div class="slot">${isW?'武器':'鎧甲'}</div><div class="nm">${e.r?`<span class="rf">+${e.r}</span> `:''}${nm}</div><div class="row">${val}</div>
   <div class="row"><button class="btn pri" type="button" data-act="refine" data-arg="${slot}" ${e.r>=10||S.inv[ore]<1||S.zeny<cost?'disabled':''}>${e.r>=10?'已達 +10':`精煉到 +${e.r+1}（${rate}%）`}</button>${e.r<10?`<span>需 ${ORES[ore].n} ×1（持有 ${S.inv[ore]}）、${fmt(cost)} Zeny</span>`:''}</div>
   ${canUp?`<div class="row"><button class="btn" type="button" data-act="upgrade" data-arg="${slot}" ${S.zeny<TPRICE[nt]||S.L<TREQ[nt]?'disabled':''}>購買 ${isW?WNAMES[CL().wk][nt]:ANAMES[nt]}</button><span>${isW?`ATK ${WATK[nt]}`:`DEF ${ADEF[nt]}`} · ${fmt(TPRICE[nt])} Zeny · 需 Base Lv ${TREQ[nt]}${e.r?`（取代目前 +${e.r}）`:''}</span></div>`:'<div class="row">已是最高階裝備</div>'}</div>`};
  return`<h3>裝備</h3><div class="eqs">${card('wpn')}${card('arm')}</div>
  <p class="hint">精煉 +1～+4 為安全精煉，必定成功；+5 起成功率依序為 60／50／40／30／20／10%，失敗時裝備受損，精煉值歸零。</p>`;
 },
 shop(){
  const rows=POTS.map(p=>`<tr><td><span class="dotc" style="--c:${p.c}"></span>${p.n}</td><td class="px">${fmt(p.price)}z</td><td class="r"><button class="btn sm" type="button" data-act="buy" data-arg="${p.id}:10" ${S.zeny<p.price*10?'disabled':''}>買 10</button> <button class="btn sm" type="button" data-act="buy" data-arg="${p.id}:50" ${S.zeny<p.price*50?'disabled':''}>買 50</button></td></tr>`).join('')
   +Object.entries(ORES).map(([k,o])=>`<tr><td><span class="dotc" style="--c:${o.c}"></span>${o.n}</td><td class="px">${fmt(o.price)}z</td><td class="r"><button class="btn sm" type="button" data-act="buy" data-arg="${k}:1" ${S.zeny<o.price?'disabled':''}>買 1</button> <button class="btn sm" type="button" data-act="buy" data-arg="${k}:5" ${S.zeny<o.price*5?'disabled':''}>買 5</button></td></tr>`).join('');
  return`<h3>道具商人 · 普隆德拉</h3><p class="hint" style="margin:0 0 6px">持有 <b class="px">${fmt(S.zeny)}</b> Zeny</p><table class="tbl"><tbody>${rows}</tbody></table>`;
 },
 map(){
  return`<h3>傳送師</h3><div class="setrow" style="margin-top:0"><label class="chk"><input type="checkbox" data-set="autoMap" ${S.set.autoMap?'checked':''}> 依等級自動前往最適合的地圖</label></div><div class="maps">${MAPS.map((m,i)=>{const lk=S.L<m.req,cur=i===S.map;
   return`<div class="mapc${cur?' cur':''}${lk?' lock':''}"><span class="code">${m.code} · 建議 Lv ${m.req}+</span><span class="nm">${m.n}</span><span class="mobs">${m.mobs.map(k=>`${MOBS[k].n} Lv${MOBS[k].lv}`).join('、')}</span><span class="mobs">MVP：${MOBS[m.mvp].n} Lv${MOBS[m.mvp].lv}</span>
   <div>${cur?'<span class="tag">目前所在</span>':`<button class="btn sm" type="button" data-act="map" data-arg="${i}" ${lk?'disabled':''}>${lk?`需要 Lv ${m.req}`:'傳送'}</button>`}</div></div>`}).join('')}</div>
  <p class="hint">手動傳送會關閉自動換圖。連續陣亡 3 次時，自動換圖會暫時退回前一張地圖。</p>`;
 },
 card(){
  const keys=Object.keys(MOBS),got=keys.filter(k=>S.cards[k]).length;
  return`<h3>卡片冊 <span class="px" style="font-weight:500">${got} / ${keys.length}</span></h3><div class="cards">${keys.map(k=>{const m=MOBS[k],n=S.cards[k]||0;
   return n?`<div class="cardc"><b>${m.n}卡片</b><span class="fx">${fxText(m.card)}</span><span class="cnt">× ${n}${n>3?'（效果上限 3）':''}</span></div>`:`<div class="cardc no"><b>？？？卡片</b><span>${m.mvp?'MVP 掉落 8%':'掉落率 0.5%'}</span><span>${m.n}</span></div>`}).join('')}</div>
  <p class="hint">卡片效果永久生效，同一張最多疊加 3 次。LUK 會提高掉落率。</p>`;
 },
 set(){
  return`<h3>角色</h3><div class="setrow"><label for="nameIn">角色名稱</label><input class="inline-in" id="nameIn" maxlength="12" value="${esc(S.name)}" data-set="name"></div>
  <h3>戰鬥</h3><div class="setrow"><label class="chk"><input type="checkbox" data-set="mvp" ${S.set.mvp?'checked':''}> 主動挑戰 MVP（等級差 3 以內）</label></div>
  <div class="setrow"><label class="chk"><input type="checkbox" data-set="autoStat" ${S.set.autoStat?'checked':''}> 自動配點</label><label class="chk"><input type="checkbox" data-set="autoSell" ${S.set.autoSell?'checked':''}> 自動賣雜物</label><label class="chk"><input type="checkbox" data-set="autoMap" ${S.set.autoMap?'checked':''}> 自動換圖</label></div>
  <h3>紀錄</h3><table class="tbl"><tbody><tr><th>遊戲時間</th><td class="r px">${Math.floor(S.played/3600)}h ${Math.floor(S.played%3600/60)}m</td></tr><tr><th>擊殺 / MVP / 死亡</th><td class="r px">${fmt(S.kills)} / ${S.mvps} / ${S.deaths}</td></tr></tbody></table>
  <h3>存檔</h3><div class="setrow"><button class="btn" type="button" data-act="save">立即存檔</button><button class="btn" type="button" data-act="reset" id="resetBtn">重新開始</button></div>
  <p class="hint">重新開始會刪除本機存檔，需要連按兩次確認。</p>`;
 },
};
let pointerIn=false;
function renderTab(force){
 const body=$('#tabbody');
 if(!force&&(pointerIn&&document.activeElement&&body.contains(document.activeElement)&&/INPUT/.test(document.activeElement.tagName)))return;
 const st=body.scrollTop;body.innerHTML=TAB[curTab]();body.scrollTop=st;paintPortraits(body);renderTabs();dirty=false;lastTab=performance.now();
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;curTab=b.dataset.tab;$('#tabbody').scrollTop=0;renderTab(true);document.getElementById('tab-'+curTab)?.focus()});
const body=$('#tabbody');
body.addEventListener('pointerdown',()=>pointerIn=true);document.addEventListener('pointerup',()=>setTimeout(()=>pointerIn=false,50));
let resetArm=0;
function act(a,arg){
 switch(a){
  case'stat':{const c=statCost(S.st[arg]);if(S.pts>=c&&S.st[arg]<99){S.pts-=c;S.st[arg]++;recalc()}break}
  case'job':changeJob(arg);closeModal();break;
  case'sellall':{const mult=sellMult();let z=0,n=0;for(const k in S.etc){if(!ETC[k])continue;z+=Math.floor(ETC[k].p*mult)*S.etc[k];n+=S.etc[k]}S.etc={};addZeny(z);log(`賣出 ${n} 個雜物，獲得 ${fmt(z)} Zeny`,'sys');break}
  case'buy':{const[k,n]=arg.split(':'),q=+n,pr=(POTS.find(p=>p.id===k)||ORES[k]).price*q;if(S.zeny>=pr){S.zeny-=pr;S.inv[k]+=q;log(`購買 ${(POTS.find(p=>p.id===k)||ORES[k]).n} × ${q}（−${fmt(pr)} Zeny）`,'sys')}break}
  case'refine':refine(arg);break;
  case'upgrade':{const e=S[arg],nt=e.t+1;if(nt<7&&S.zeny>=TPRICE[nt]&&S.L>=TREQ[nt]){S.zeny-=TPRICE[nt];S[arg]={t:nt,r:0};recalc();log(`購買了 ${arg==='wpn'?WNAMES[CL().wk][nt]:ANAMES[nt]}`,'sys')}break}
  case'map':S.set.autoMap=false;setMap(+arg);break;
  case'save':save();break;
  case'reset':if(resetArm&&performance.now()-resetArm<4000){try{localStorage.removeItem(SAVE_KEY)}catch(e){}S=defaultState();boot(true);log('已重新開始','sys');resetArm=0}else{resetArm=performance.now();const b=$('#resetBtn');if(b){b.textContent='再按一次確認重新開始';b.classList.add('pri')}return}break;
 }
 renderTab(true);updateBasic();
}
body.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;act(b.dataset.act,b.dataset.arg)});
body.addEventListener('input',e=>{const el=e.target,k=el.dataset.set;if(!k)return;
 if(k==='potHp'||k==='potSp'){S.set[k]=+el.value;const v=document.getElementById(k+'V');if(v)v.textContent=el.value+'%'}
 else if(k==='name'){S.name=el.value.trim().slice(0,12)||'無名冒險者';updateBasic()}});
body.addEventListener('change',e=>{const el=e.target,k=el.dataset.set;if(!k||el.type!=='checkbox')return;
 if(k.startsWith('skill:')){const id=k.slice(6);if(el.checked)delete S.skillOff[id];else S.skillOff[id]=1}
 else{S.set[k]=el.checked;if(k==='autoStat'&&el.checked)autoStat();if(k==='autoMap')autoMapT=0}
 save();dirty=true});
document.querySelectorAll('[data-speed]').forEach(b=>b.addEventListener('click',()=>{S.set.speed=+b.dataset.speed;syncSpeed()}));
function syncSpeed(){document.querySelectorAll('[data-speed]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.speed===S.set.speed)))}

function refine(slot){
 const e=S[slot],ore=slot==='wpn'?'ori':'elu',cost=(e.t+1)*(e.r+1)*150;
 if(e.r>=10||S.inv[ore]<1||S.zeny<cost)return;
 S.inv[ore]--;S.zeny-=cost;const nm=slot==='wpn'?WNAMES[CL().wk][e.t]:ANAMES[e.t];
 if(Math.random()*100<REFINE_RATE[e.r]){e.r++;log(`精煉成功！+${e.r} ${nm}`,'lv');showBanner('精煉成功！',`+${e.r} ${nm}`,'#8fd8ff')}
 else{const was=e.r;e.r=0;log(`精煉失敗……+${was} ${nm} 受損，精煉值歸零`,'bad');showBanner('精煉失敗',`${nm} 精煉值歸零`,'#ff8f8f')}
 recalc();
}
function changeJob(k){
 if(S.cls!=='novice'||S.JL<10||!CLASSES[k])return;
 let spent=0;for(const s of STATS){for(let v=1;v<S.st[s];v++)spent+=statCost(v);S.st[s]=1}
 S.pts+=spent;S.cls=k;S.JL=1;S.jexp=0;S.skillOff={};recalc();autoStat();hero.hp=P.maxHp;hero.sp=P.maxSp;hero.cds={};
 lvFx('Job Change!');showBanner('轉職成功！',`${S.name} 成為了${CLASSES[k].n}`,'#ffe14a');log(`恭喜轉職成為 ${CLASSES[k].n}！能力點數已重新分配。`,'lv');
 faceDraw();save();
}
function openModal(title,html){$('#modal-h').textContent=title;const b=$('#modal-b');b.innerHTML=html;paintPortraits(b);$('#modal').hidden=false;b.querySelector('button')?.focus()}
function closeModal(){$('#modal').hidden=true}
function openJobModal(){if(S.cls!=='novice')return;openModal('轉職 · Job Lv 10 達成',`<p>選擇你的一轉職業。轉職後能力點數會重置並依新職業重新分配，Job Lv 從 1 開始。</p>${jobChoices()}<p class="hint" style="margin-top:10px"><button class="btn" type="button" data-close>稍後再說</button> 之後也可以在「技能」分頁轉職。</p>`)}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('[data-close]')){closeModal();return}const b=e.target.closest('[data-act]');if(b){act(b.dataset.act,b.dataset.arg)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});

/* ================= 離線收益 ================= */
function offlineGain(sec,show){
 sec=Math.min(sec,8*3600);if(sec<60)return;
 const e=Math.floor(S.rate.e*sec*.5),j=Math.floor(S.rate.j*sec*.5),z=Math.floor(S.rate.z*sec*.5);if(!e&&!z)return;
 const L0=S.L,J0=S.JL;gainExp(e,j);addZeny(z);acc={e:0,j:0,z:0,t:0};
 const m=Math.floor(sec/60),tt=m>=60?`${Math.floor(m/60)} 小時 ${m%60} 分`:`${m} 分鐘`;
 log(`離線掛機 ${tt}：Base EXP +${fmt(e)}、Job EXP +${fmt(j)}、Zeny +${fmt(z)}`,'sys');
 if(show)openModal('歡迎回來',`<p>你離開了 <b>${tt}</b>，${esc(S.name)} 在 ${MAP().n} 持續掛機（離線效率 50%）。</p><table class="tbl"><tbody><tr><th>Base EXP</th><td class="r px">+${fmt(e)}${S.L>L0?`（Lv ${L0} → ${S.L}）`:''}</td></tr><tr><th>Job EXP</th><td class="r px">+${fmt(j)}${S.JL>J0?`（Lv ${J0} → ${S.JL}）`:''}</td></tr><tr><th>Zeny</th><td class="r px">+${fmt(z)}</td></tr></tbody></table><p class="hint" style="margin-top:10px"><button class="btn pri" type="button" data-close>繼續冒險</button></p>`);
}

/* ================= 啟動 ================= */
let last=performance.now(),uiT=0,saveT=0,running=false;
function frame(now){
 let dt=(now-last)/1000;last=now;
 if(dt>5){offlineGain(dt,false);dt=0}
 dt=Math.min(dt,.05);
 const n=S.set.speed||1;for(let i=0;i<n;i++)update(dt);
 render();
 uiT+=dt;if(uiT>.15){uiT=0;updateBasic();if(dirty&&now-lastTab>500)renderTab()}
 saveT+=dt;if(saveT>15){saveT=0;save()}
 requestAnimationFrame(frame);
}
function boot(fresh){
 for(const k in CLASSES)LOOKS[k]=heroLook(k);
 jobPrompted=S.cls!=='novice';
 recalc();autoStat();hero.hp=P.maxHp;hero.sp=P.maxSp;hero.dead=false;hero.cds={};
 setMap(S.map||0,true);
 chatEl.innerHTML='';
 log(`歡迎來到 ${MAP().n}！角色會自動戰鬥與撿取道具。`,'sys');
 log('在右側選單調整能力值、技能、裝備與地圖。','sys');
 syncSpeed();faceDraw();updateBasic();renderTab(true);
 if(!fresh&&S.cls==='novice'&&S.JL>=10)timers.push({t:1,fn:openJobModal});
}
function start(data){
 let fromHot=false;
 if(data&&data.save){try{S=merge(defaultState(),JSON.parse(data.save));fromHot=true}catch(e){}}
 if(!S)S=loadSave();
 const had=!!S;if(!S)S=defaultState();
 const away=(Date.now()-(S.t||Date.now()))/1000;
 boot(!had);
 if(had&&!fromHot&&away>60)offlineGain(away,true);
 if(!running){running=true;last=performance.now();requestAnimationFrame(frame)}
}
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
const hot=window.claude&&window.claude.hot;
try{if(hot&&hot.snapshot)hot.snapshot(()=>({save:JSON.stringify(S)}))}catch(e){}
if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data||{});
})();
</script>
